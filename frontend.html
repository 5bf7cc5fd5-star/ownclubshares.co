<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,shrink-to-fit=no"/>
<title>Own Club Share</title>
<script src="/static/oc-logo.js?v=lock9"></script>
<style>
:root{--bg:#0b0c10;--surface:#141820;--elev:#1a2230;--fg:#f4f1ea;--muted:#9aa3ad;--subtle:#6d7680;--gold:#d4af37;--line:rgba(212,175,55,.16);--up:#3dcc8a;--down:#e57373;--ink:#0b0c10;--fb:#1877F2;--fbGreen:#42B72A;--fbBg:#F0F2F5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;touch-action:manipulation}
.stage{position:fixed;inset:0;width:100%;height:100%;height:100dvh;margin:0;background:var(--bg);overflow:hidden}
.stage.auth{background:var(--fbBg)}
.screen{display:none;height:100%}.screen.on{display:block}.hidden{display:none!important}
.scroll{height:100%;overflow:auto;padding-bottom:84px}
.btn{width:100%;height:44px;border:0;border-radius:10px;background:var(--gold);color:#000;font-weight:700}
.btn.ghost{background:var(--elev);color:var(--fg);border:1px solid var(--line)}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:80;display:flex;align-items:flex-end}
.modal.hidden{display:none}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-height:82%;overflow:auto;padding:18px 16px 28px}
.raffle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rcard{height:112px;perspective:700px;cursor:pointer}
.rcard .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s}
.rcard.open .inner{transform:rotateY(180deg)}
.rcard .face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;backface-visibility:hidden}
.rcard .back{background:linear-gradient(160deg,#1a2230,#d4af37);color:#0b0c10;font-weight:800}
.rcard .front{background:var(--elev);border:1px solid var(--line);transform:rotateY(180deg);text-align:center;padding:8px}
.chat-log{height:250px;overflow:auto;background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.bubble{max-width:82%;padding:8px 10px;border-radius:12px;margin:6px 0;font-size:13px}
.bubble.me{margin-left:auto;background:var(--gold);color:var(--ink)}
.bubble.ag{background:#10161f;border:1px solid var(--line)}
.agent-pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.agent-pills button{border:1px solid var(--line);background:var(--elev);color:var(--muted);border-radius:999px;padding:5px 9px;font-size:11px}
.agent-pills button.on{background:var(--gold);color:var(--ink)}
.chat-send{display:flex;gap:8px}
.chat-send input{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--elev);color:var(--fg);padding:0 12px}
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#0b0c10}
.tabs button{background:0;border:0;color:var(--subtle);min-height:58px;font-size:10px}
.tabs button.on{color:var(--gold)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grid4 button{background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:10px 2px;color:var(--fg)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pad{padding:14px 16px}.note{font-size:12px;color:var(--muted)}.subtle{color:var(--subtle)}.ccy-line{font-size:11px;color:var(--muted)}
.fb-wrap{padding:14px 22px}.fb-word{color:var(--fb);font-size:34px;font-weight:800}
.fb-input,.fb-select{width:100%;height:46px;border-radius:8px;border:1px solid #dddfe2;padding:0 12px;margin-bottom:12px}
.fb-login{width:100%;height:46px;border:0;border-radius:8px;background:var(--fb);color:#fff;font-weight:800}
.fb-create{width:72%;margin:0 auto;display:block;height:42px;border:0;border-radius:8px;background:var(--fbGreen);color:#fff;font-weight:800}
.club{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;color:inherit;margin-top:7px}
.leagues{display:flex;gap:6px;overflow:auto}.leagues button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 11px}
.leagues button.on{background:var(--gold);color:var(--ink)}
.copy-box{background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all;margin:8px 0}
</style></head>
<body>
<div class="stage auth" id="stage">
<section id="login" class="screen on"><div class="scroll"><div class="fb-wrap">
<select id="langSelect" class="fb-lang"><option value="en">English</option><option value="lg">Luganda</option><option value="sw">Kiswahili</option></select>
<div class="fb-hero"><img id="logoHero" alt="Own Club"/><div class="fb-word">own club</div><div class="fb-sub">Share Market</div></div>
<form id="loginForm"><div class="phone-row"><select id="loginCode" class="fb-select"><option value="+256" selected>+256 UG</option><option value="+965">+965 KW</option></select>
<input class="fb-input" id="loginId" placeholder="Mobile number or email" required/></div>
<input class="fb-input" id="loginPass" type="password" placeholder="Password" required/>
<button class="fb-login" id="tabLogin">Log In</button>
<button class="fb-forgot" type="button" id="btnForgot">Forgot Password?</button>
<button class="fb-create" type="button" id="tabSignup">Create New Account</button></form>
<form id="signupForm" class="hidden">
<input class="fb-input" id="suName" placeholder="Full Name" required/>
<select id="suCode" class="fb-select" onchange="onCountryCode()"><option value="+256" data-ccy="UGX" data-rate="3700" selected>+256 UG</option></select>
<input class="fb-input" id="suPhone" placeholder="Mobile number" required/>
<input class="fb-input" id="suEmail" type="email" required/>
<p id="ccyHint">Currency: UGX</p>
<input class="fb-input" id="suPass" type="password" required/>
<input class="fb-input" id="suInvite" value="IMXT2Y0M8D"/>
<button class="fb-create" type="submit">Sign Up</button>
<button type="button" id="backLogin">Already have an account?</button>
</form><div id="authErr"></div></div></div></section>
<section id="home" class="screen"><div class="scroll"><header class="top"><img class="logoTop" alt=""/></header><div class="pad"><p id="homeBal">USD 0</p><p id="homeBalLocal"></p><p id="homeBook"></p><p id="homeBookLocal"></p><div id="watchlist"></div></div></div></section>
<section id="market" class="screen"><div class="scroll"><div class="pad"><div class="leagues" id="leagues"></div><div id="marketList"></div></div></div></section>
<section id="club" class="screen"><div class="scroll"><div class="pad"><div id="clubName">Club</div><div id="clubLeague"></div><h1 id="clubPx">USD 0</h1><span id="clubPill"></span><p id="clubPxLocal"></p><div id="clubChart"></div><div id="clubPacks"></div><p id="qtyCost"></p><button class="btn" id="buyBtn">Buy pack</button><div id="buyErr"></div></div></div></section>
<section id="shares" class="screen"><div class="scroll"><div class="pad"><p id="holdVal"></p><p id="holdValLocal"></p><div id="holdList"></div></div></div></section>
<section id="team" class="screen"><div class="scroll"><div class="pad"><p id="myCode"></p><div class="copy-box" id="inviteLink"></div><button class="btn" id="btnCopyLink">Copy invite link</button><button class="btn ghost" id="btnShare">Share</button></div></div></section>
<section id="account" class="screen"><div class="scroll"><div class="pad"><span id="accInit">A</span><b id="accName">Member</b><span id="accSub"></span><p id="accBal"></p><p id="accBalLocal"></p><p id="divBal"></p><p id="divBalLocal"></p><button class="btn" id="btnWithdrawDiv">Withdraw Dividend</button><button class="btn ghost" id="btnCreditWallet">Credit to Wallet</button><div class="grid4" id="accGrid"><button type="button" data-act="deposit">Deposit</button><button type="button" data-act="withdraw">Withdraw</button><button type="button" data-act="bill">Bill</button><button type="button" data-act="invite">Invite</button><button type="button" data-act="team">My team</button><button type="button" data-act="vip">VIP Task</button><button type="button" data-act="reward">Reward</button><button type="button" data-act="raffle">Raffle</button><button type="button" data-act="manager">Manager</button><button type="button" data-act="settings">Settings</button><button type="button" data-act="salary">Salary</button><button type="button" data-act="support">Support</button></div><img class="logoBig" alt=""/><button class="btn ghost" id="signOut">Sign out</button></div></div></section>
<nav class="tabs" id="dock"><button data-go="home">Home</button><button data-go="market">Market</button><button data-go="shares">Shares</button><button data-go="team">Team</button><button data-go="account">Account</button></nav>
</div>
<div id="modalDeposit" class="modal hidden"><div class="sheet"><h3>Deposit</h3><div class="copy-box">0779168109</div><button class="btn" id="btnCopyMomo">Copy MoMo</button><div class="copy-box">TLvT3czNGgpPH3oXURZFtyd4XTQUL2NhGy</div><button class="btn ghost" id="btnCopyCrypto">Copy crypto</button><input id="depTxid"/><button class="btn" id="btnSubmitDep">Submit</button></div></div>
<div id="modalWithdraw" class="modal hidden"><div class="sheet"><h3>Withdraw</h3><input id="wdAmt" type="number"/><p id="wdAmtLocal"></p><input id="wdDest"/><button class="btn" id="btnDoWithdraw">Request withdraw</button></div></div>
<div id="modalRaffle" class="modal hidden"><div class="sheet"><h3>Raffle</h3><p class="note" id="raffleNote">Buy a pack, then flip one card. Winning is by chance.</p><p id="raffleChances">Chances: 0</p><div class="raffle-grid" id="raffleGrid"></div><p id="raffleResult"></p><button class="btn" id="btnPlayRaffle">Deal new cards</button></div></div>
<div id="modalSupport" class="modal hidden"><div class="sheet"><h3>Support chat</h3><p class="note" id="supportWho">On-duty agent</p><div class="agent-pills" id="agentPills"></div><div class="chat-log" id="chatLog"></div><div class="chat-send"><input id="chatInput" placeholder="Type a message"/><button class="btn" id="btnChatSend">Send</button></div></div></div>
<div id="modalGeneric" class="modal hidden"><div class="sheet"><h3 id="genTitle">Info</h3><p id="genBody"></p></div></div>
<script src="/static/oc-app.js?v=lock9"></script>
<script src="/static/oc-extra.js?v=lock9"></script>
</body></html>
